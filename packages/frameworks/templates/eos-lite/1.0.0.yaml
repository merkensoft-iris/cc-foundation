# eos-lite 1.0.0: docs/design/01-onboarding-and-frameworks.md §5.3, agendas in 02 §5.1 to
# §5.4. Compiled into src/generated/catalogue.ts by pnpm cc:gen; validated against
# framework_template@1 (01 §4).
id: eos-lite
version: 1.0.0
name: EOS-style operating system, light
summary: Quarterly priorities, a weekly leadership meeting with a scorecard, and monthly, quarterly and yearly reviews, for companies of fewer than 10 people.
appliesTo: [company, business_unit, client_engagement, project]
sources:
  - label: "The light system in regime/ceo-operating-cadence.md §5, adapting EOS's Level 10 meeting and Rocks (S6, S7) to a founder-led company"
    ref: docs/design/01-onboarding-and-frameworks.md#53-eos-lite-v1-eos-style-fewer-than-10-people-ships-in-p1
  - label: 'EOS is sized for roughly 10 to 250 employees (S31), so the full eos template starts at 10 people'
    ref: regime/ceo-operating-cadence.md §5
backbone:
  goalModel: rocks
  meetings:
    - key: weekly
      cadence: weekly
      agendaTemplateId: agenda.eos-lite.weekly@1
      required: true
      modes: [solo, team]
      durationMinutes: { min: 45, default: 60, max: 90 }
    - key: monthly
      cadence: monthly
      agendaTemplateId: agenda.eos-lite.monthly@1
      required: true
      modes: [solo, team]
      durationMinutes: { min: 60, default: 90, max: 120 }
    - key: quarterly
      cadence: quarterly
      agendaTemplateId: agenda.eos-lite.quarterly@1
      required: true
      modes: [solo, team]
      durationMinutes: { min: 120, default: 240, max: 480 }
    - key: yearly
      cadence: yearly
      agendaTemplateId: agenda.eos-lite.yearly@1
      required: true
      modes: [solo, team]
      durationMinutes: { min: 240, default: 480, max: 480, defaultByMode: { solo: 240 } }
    - key: daily
      cadence: daily
      agendaTemplateId: agenda.eos-lite.daily@1
      required: false
      modes: [team]
      durationMinutes: { min: 5, default: 10, max: 15 }
  invariants:
    - id: E-1
      text: 'Exactly one weekly leadership meeting per workstream, or one block for it inside a merged meeting (02 §4.4). It has a fixed weekday and time. Agenda order: check_in → scorecard → goals_review → action_review → headlines → issues → conclude.'
      validator: weeklyLeadershipMeeting
    - id: E-2
      text: The scorecard has 5 to 15 active weekly measures. Each has one owner and a target, and is read every week as normal or not normal. In solo mode the minimum is 3.
      validator: scorecardSize
    - id: E-3
      text: 1 to priorityCount quarterly priorities per workstream (bounds 1 to 5, default 3). Each has one owner and a done-means, and is graded done or not done at quarterly planning (never "90% done").
      validator: priorityCountAndShape
    - id: E-4
      text: Each to-do has one owner, a due date at most todoHorizonDays after creation (7 to 14, default 7) and a done-means. Longer work must link to a priority or be split.
      validator: todoHorizon
    - id: E-5
      text: action_review records only done or not done. Misses move to issues, with no discussion inside action_review.
      validator: actionReviewDoneOrNotDone
    - id: E-6
      text: Every issue resolved in issues ends as a decision, as one or more action items, or as an explicit drop with a note.
      validator: issueResolutionOutcome
    - id: E-7
      text: Every decision has exactly one decider (also INV-03-02).
      validator: decisionSingleDecider
    - id: E-8
      text: 'The monthly review includes register health: share of items closed on time, items rolled over twice or more, and the oldest open item.'
      validator: monthlyRegisterHealth
parameters:
  - key: weekly.weekday
    type: weekday
    default: FR
    description: Fixed day of the weekly leadership meeting (E-1).
  - key: weekly.time
    type: time_of_day
    default: '15:00'
    description: Fixed local start time of the weekly leadership meeting (E-1).
  - key: weekly.duration
    type: duration_minutes
    default: 60
    min: 45
    max: 90
    description: Length of the weekly leadership meeting in minutes.
  - key: monthly.week
    type: enum
    default: last
    enum: [first, last]
    description: Week of the month that holds the monthly money and operations review.
  - key: quarterly.weekOfQuarter
    type: int
    default: -2
    min: -2
    max: -1
    description: Week of the last quarter month that holds quarterly planning, counted from its end.
  - key: priorityCount
    type: int
    default: 3
    min: 1
    max: 5
    description: Most quarterly priorities per workstream (E-3).
  - key: todoHorizonDays
    type: int
    default: 7
    min: 7
    max: 14
    description: Longest a to-do may run from creation to due date (E-4).
  - key: conclude.rating
    type: bool
    default: true
    defaultByMode: { solo: false }
    description: Rate the meeting 1 to 10 at conclude; default on in team mode and off in solo mode.
  - key: decision.method
    type: enum
    default: single_decider
    enum: [single_decider, daci]
    description: How decisions are made (Q-T05).
  - key: decision.memoForOneWayDoors
    type: bool
    default: true
    description: Require a memo for one-way-door decisions (Q-T05).
extensionSlots: ['after:headlines']
defaultPacks: []
vocabulary:
  goal: Priority
  action: To-do
  issue: Issue
  measure: Scorecard line
  meeting: Meeting
